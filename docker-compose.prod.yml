services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
    container_name: orbit-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
      NEXT_PUBLIC_LIVEKIT_URL: wss://${DOMAIN}/livekit
    depends_on:
      - server
    labels:
      - traefik.enable=true
      - traefik.http.routers.orbit-web.rule=Host(`orbit.wondercraftz.com`)
      - traefik.http.routers.orbit-web.entrypoints=https
      - traefik.http.routers.orbit-web.tls=true
      - traefik.http.routers.orbit-web.tls.certresolver=letsencrypt
      - traefik.http.routers.orbit-web.priority=1
      - traefik.http.routers.orbit-web.service=orbit-web
      - traefik.http.services.orbit-web.loadbalancer.server.port=3000

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: orbit-server
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.orbit-api.rule=Host(`orbit.wondercraftz.com`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.orbit-api.entrypoints=https
      - traefik.http.routers.orbit-api.tls=true
      - traefik.http.routers.orbit-api.tls.certresolver=letsencrypt
      - traefik.http.routers.orbit-api.priority=100
      - traefik.http.routers.orbit-api.service=orbit-api
      - traefik.http.services.orbit-api.loadbalancer.server.port=4000
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit_admin}:${POSTGRES_PASSWORD:-orbit_secret_password}@postgres:5432/${POSTGRES_DB:-orbit_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-orbit_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-orbit_production_jwt_secret_key_change_me}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-API_KEY_ORBIT}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-orbit_livekit_secret_key_change_in_production}
      LIVEKIT_URL: http://livekit:7880
      NEXT_PUBLIC_LIVEKIT_URL: wss://${DOMAIN}/livekit
      CLIENT_URL: https://${DOMAIN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit_admin} -d ${POSTGRES_DB:-orbit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-orbit_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orbit_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: orbit-livekit
    restart: unless-stopped
    # Inline config: Coolify doesn't copy repo files for bind mounts (they appear as empty dirs).
    # Redis password and key/secret must match REDIS_PASSWORD / LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
    command:
      - --config-body
      - '{port: 7880, rtc: {tcp_port: 7881, port_range_start: 40000, port_range_end: 40050, use_external_ip: true}, redis: {address: "redis:6379", password: orbit_redis_password}, keys: {API_KEY_ORBIT: orbit_livekit_secret_key_change_in_production}, logging: {level: info}}'
    ports:
      - "7881:7881"
      - "40000-40050:40000-40050/udp"
    depends_on:
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.orbit-livekit.rule=Host(`orbit.wondercraftz.com`) && PathPrefix(`/livekit`)
      - traefik.http.routers.orbit-livekit.entrypoints=https
      - traefik.http.routers.orbit-livekit.tls=true
      - traefik.http.routers.orbit-livekit.tls.certresolver=letsencrypt
      - traefik.http.routers.orbit-livekit.priority=100
      - traefik.http.routers.orbit-livekit.service=orbit-livekit
      - traefik.http.middlewares.orbit-livekit-strip.stripprefix.prefixes=/livekit
      - traefik.http.routers.orbit-livekit.middlewares=orbit-livekit-strip
      - traefik.http.services.orbit-livekit.loadbalancer.server.port=7880

volumes:
  postgres_data:
  redis_data:
