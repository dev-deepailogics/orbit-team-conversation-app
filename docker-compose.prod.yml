services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
    container_name: orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
      NEXT_PUBLIC_LIVEKIT_URL: wss://${DOMAIN}/livekit
    depends_on:
      - server
    labels:
      - traefik.enable=true
      - traefik.http.routers.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.rule=Host(`${DOMAIN:?DOMAIN must be set}`)
      - traefik.http.routers.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.entrypoints=https
      - traefik.http.routers.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.tls=true
      - traefik.http.routers.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.tls.certresolver=letsencrypt
      - traefik.http.routers.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.priority=1
      - traefik.http.routers.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.service=orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
      - traefik.http.services.orbit-web${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.loadbalancer.server.port=3000

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: orbit-server${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.rule=Host(`${DOMAIN:?DOMAIN must be set}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.entrypoints=https
      - traefik.http.routers.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.tls=true
      - traefik.http.routers.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.tls.certresolver=letsencrypt
      - traefik.http.routers.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.priority=100
      - traefik.http.routers.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.service=orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
      - traefik.http.services.orbit-api${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.loadbalancer.server.port=4000
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-orbit_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 48)}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-API_KEY_ORBIT}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      LIVEKIT_URL: http://livekit:7880
      NEXT_PUBLIC_LIVEKIT_URL: wss://${DOMAIN}/livekit
      CLIENT_URL: https://${DOMAIN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: https://${DOMAIN}/api/auth/microsoft/callback
      UPLOAD_DIR: /data/uploads
    volumes:
      - orbit_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-orbit_admin} -d ${POSTGRES_DB:-orbit_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit-redis${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-orbit_redis_password}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
    restart: unless-stopped
    # Inline config: Coolify doesn't copy repo files for bind mounts (they appear as empty dirs).
    # Redis password and key/secret must match REDIS_PASSWORD / LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
    command:
      - --config-body
      - '{port: 7880, rtc: {tcp_port: ${LIVEKIT_TCP_PORT:-7881}, port_range_start: ${LIVEKIT_UDP_START:-40000}, port_range_end: ${LIVEKIT_UDP_END:-40050}, use_external_ip: true}, redis: {address: "redis:6379", password: ${REDIS_PASSWORD}}, keys: {${LIVEKIT_API_KEY:-API_KEY_ORBIT}: ${LIVEKIT_API_SECRET}}, logging: {level: info}}'
    ports:
      # Host and container ports must match: LiveKit advertises these to clients. Give each environment its own range.
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}"
      - "${LIVEKIT_UDP_START:-40000}-${LIVEKIT_UDP_END:-40050}:${LIVEKIT_UDP_START:-40000}-${LIVEKIT_UDP_END:-40050}/udp"
    depends_on:
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.rule=Host(`${DOMAIN:?DOMAIN must be set}`) && PathPrefix(`/livekit`)
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.entrypoints=https
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.tls=true
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.tls.certresolver=letsencrypt
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.priority=100
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.service=orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
      - traefik.http.middlewares.orbit-livekit-strip${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.stripprefix.prefixes=/livekit
      - traefik.http.routers.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.middlewares=orbit-livekit-strip${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}
      - traefik.http.services.orbit-livekit${ENV_SUFFIX:?ENV_SUFFIX must be set (-prod or -dev)}.loadbalancer.server.port=7880

volumes:
  postgres_data:
  redis_data:
  orbit_uploads:
